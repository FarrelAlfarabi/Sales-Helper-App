<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pratinjau Desain Zonein</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sticky controls; Phone = one clickable 360x720 prototype with a screen index; Desktop = manager dashboard on a 1280x800 (16:10) board scaled to fit. Design A "Quiet Ledger": IBM Plex Sans, flat bordered cards, brand green. */
:root{--bg:#eef2f0;--fg:#14211c;--muted:#52635b;--line:#d3ddd8;--card:#ffffff;--brand:#0a8f6b;--on-brand:#ffffff;--bar:#ffffff;--ring:#0a8f6b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1714;--fg:#e8f1ed;--muted:#9bb0a7;--line:#2a3a33;--card:#17221e;--bar:#17221e;--brand:#2fc79b;--on-brand:#06201a;--ring:#2fc79b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1714;--fg:#e8f1ed;--muted:#9bb0a7;--line:#2a3a33;--card:#17221e;--bar:#17221e;--brand:#2fc79b;--on-brand:#06201a;--ring:#2fc79b;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:10}
.notice{margin:16px auto 0;max-width:1280px;font-size:13px;color:var(--muted)}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bar);border-bottom:1px solid var(--line);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center}
.bar h1{font-size:17px;margin:0;font-weight:600;margin-right:auto}
.group{display:flex;gap:6px;flex-wrap:wrap}
.group button,.chips button{min-height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-weight:500;cursor:pointer}
.group button[aria-pressed="true"],.chips button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
button:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.wrap{max-width:1280px;margin:18px auto 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips .lbl{align-self:center;font-size:13px;color:var(--muted);margin-right:4px}
#phoneView{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start;justify-content:center}
.idx{flex:1 1 260px;max-width:380px}
.idx h2{font-size:15px;margin:0 0 6px}
.idx .grp{margin-bottom:14px}
.idx .grp b{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px}
.pframe{width:378px;max-width:100%;height:738px;border:9px solid #1b1f1d;border-radius:36px;background:#1b1f1d;overflow:hidden;position:relative;flex:none}
#pscreen{position:absolute;inset:0;overflow:auto}
.fit{position:relative;width:100%;overflow:hidden;border-radius:10px;border:1px solid var(--line)}
.board{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;overflow:hidden}
[hidden]{display:none!important}

/* ===== artboard tokens (phone + desktop share) ===== */
.ab{--ink:#14211c;--mut:#5a6b63;--ln:#d9e2de;--sf:#f6f8f7;--br:#0a8f6b;--soft:#e3f1eb;--warn:#b45309;--warnbg:#fdecd2;--bad:#b3261e;--badbg:#fbe3e0;--m-bg:#eceee6;--m-st:#fff;--m-st2:#dcdccf;font-family:"IBM Plex Sans",sans-serif;color:var(--ink);background:var(--sf)}
.ab *{scrollbar-width:thin}
.ab [data-go],.ab [data-pg]{cursor:pointer}
.mp{position:relative;overflow:hidden;background:var(--m-bg);border-radius:10px}
.mp::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 47%,var(--m-st) 47% 52%,transparent 52%),linear-gradient(0deg,transparent 58%,var(--m-st) 58% 63%,transparent 63%),linear-gradient(35deg,transparent 30%,var(--m-st2) 30% 32%,transparent 32%)}
.mp i{position:absolute;left:50%;top:50%;width:var(--cs,110px);height:var(--cs,110px);margin:calc(var(--cs,110px)/-2) 0 0 calc(var(--cs,110px)/-2);border-radius:50%;background:rgba(220,38,38,.2);border:2px solid #dc2626}
.mp u{position:absolute;left:var(--px,50%);top:var(--py,50%);width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#dc2626;border:3px solid #fff}
.ph{border-radius:8px;background:linear-gradient(135deg,#d4e3dc,#b7d0c4);display:grid;place-items:center;font-size:11px;color:#2f5a49;text-align:center}
.tg{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--br);font-weight:600;white-space:nowrap}
.tg.w{background:var(--warnbg);color:var(--warn)}.tg.b{background:var(--badbg);color:var(--bad)}.tg.nt{background:#eef1f0;color:var(--mut)}
.btn{display:block;background:var(--br);color:#fff;text-align:center;font-weight:600;padding:12px;border-radius:8px}
.btn.o{background:#fff;color:var(--br);border:1px solid var(--br)}
.fld{background:#fff;border:1px solid var(--ln);border-radius:8px;padding:10px 12px;color:var(--mut);margin-bottom:10px;display:flex;justify-content:space-between;gap:8px}
.fld small{display:block;font-size:10px;color:var(--mut)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:#fff;border:1px solid var(--ln);border-radius:8px;padding:10px 12px;font-size:11px;color:var(--mut)}
.kpi b{display:block;font:500 20px "IBM Plex Mono",monospace;color:var(--ink)}
.card{background:#fff;border:1px solid var(--ln);border-radius:8px;padding:12px;margin-bottom:8px}
.card b{font-weight:600}.card>b{display:block}.card small{color:var(--mut);display:block}

/* ----- phone ----- */
.pn{min-height:100%;display:flex;flex-direction:column;font-size:13px;line-height:1.4;background:var(--sf)}
.sbar{height:26px;flex:none;display:flex;justify-content:space-between;padding:6px 16px 0;font-size:10px;color:var(--mut)}
.phd{display:flex;align-items:center;gap:8px;padding:6px 16px 10px;font-weight:600;font-size:16px;position:sticky;top:0;background:var(--sf);z-index:2}
.phd .bk{width:26px;height:26px;border-radius:50%;background:var(--soft);color:var(--br);display:grid;place-items:center;cursor:pointer;font-size:14px}
.pb{padding:0 16px 24px;flex:1}
.sec{font-size:10px;color:var(--mut);font-weight:600;padding:14px 16px 4px;letter-spacing:.04em}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--ln);background:#fff}
.row .ic{width:28px;height:28px;border-radius:8px;background:var(--soft);color:var(--br);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.row b{font-weight:500}.row small{display:block;color:var(--mut);font-size:11px}.row .ch{margin-left:auto;color:var(--mut)}
.sh{padding:2px 0}
.act{display:flex;gap:10px;padding:12px;background:#fff;border:1px solid var(--ln);border-radius:8px;margin-bottom:8px}
.act .n{width:24px;height:24px;border-radius:50%;background:var(--soft);color:var(--br);font-weight:700;display:grid;place-items:center;flex:none;font-size:12px}
.hd2{font-size:15px;font-weight:600;margin:20px 0 8px}
.lim{font-size:11px;color:var(--mut);margin:0 0 4px}

/* ----- desktop ----- */
.side{position:absolute;left:0;top:0;bottom:0;width:230px;background:var(--sf);border-right:1px solid var(--ln);padding:26px 16px;overflow:auto}
.wm{font-weight:600;font-size:20px;color:var(--br);padding:0 10px 18px}
.nv{padding:9px 10px;border-radius:8px;font-size:14px;color:var(--mut);margin-bottom:2px}
.nv.on{background:var(--soft);color:var(--br);font-weight:600}
.nvh{font-size:11px;color:var(--mut);font-weight:600;padding:12px 10px 4px}
.main{position:absolute;left:230px;right:0;top:0;bottom:0;padding:28px 36px;overflow:hidden;background:#fff}
.main h3{margin:0 0 2px;font-size:22px;font-weight:600}
.sub{color:var(--mut);font-size:13px;margin-bottom:18px}
.strip{display:flex;border:1px solid var(--ln);border-radius:8px;margin-bottom:18px}
.strip div{flex:1;padding:12px 16px;border-right:1px solid var(--ln);font-size:12px;color:var(--mut)}
.strip div:last-child{border:0}
.strip b{display:block;font:500 24px "IBM Plex Mono",monospace;color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;color:var(--mut);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--ln)}
td{padding:10px;border-bottom:1px solid var(--ln);vertical-align:top}
tr.sel td{background:var(--soft)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}
.hd{font-size:14px;font-weight:600;margin:14px 0 6px}
.dact{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--ln);border-radius:8px;margin-bottom:6px;font-size:13px}
.dact .n{width:22px;height:22px;border-radius:50%;background:var(--soft);color:var(--br);font-weight:700;display:grid;place-items:center;flex:none;font-size:12px}
.dbox{border:1px solid var(--ln);border-radius:8px;padding:12px 14px;margin-bottom:8px;font-size:13px}
.dbox small{display:block;color:var(--mut)}
.login{position:absolute;inset:0;background:var(--sf);display:grid;place-items:center}
.lc{width:380px;background:#fff;border:1px solid var(--ln);border-radius:10px;padding:32px}
.lc .wm{padding:0 0 4px;font-size:26px}
.bar2{height:10px;border-radius:5px;background:var(--soft);overflow:hidden}.bar2 i{display:block;height:100%;background:var(--br)}
@media (prefers-reduced-motion:no-preference){.group button,.chips button{transition:background .15s}}
</style>

</head>
<body>
<div class="notice">Pratinjau desain dengan data contoh. Semua nama, angka, foto, dan hasil AI di layar ini hanya [contoh], bukan data asli. Tampilan ponsel bisa diklik.</div>

<header class="bar">
  <h1>Zonein desain A, semua fitur</h1>
  <div class="group" role="group" aria-label="Preview type" id="views">
    <button data-v="phone" aria-pressed="true">Ponsel</button>
    <button data-v="desk" aria-pressed="false">Desktop 16:10</button>
  </div>
</header>

<div class="wrap">
  <div id="phoneView">
    <div class="idx" id="idx"></div>
    <div class="pframe"><div id="pscreen" class="ab"></div></div>
  </div>
  <div id="deskView" hidden>
    <div class="chips" id="dpages" role="group" aria-label="Desktop page"></div>
    <div class="fit" id="fit"><div class="board ab" id="board"></div></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const ROLE_NOTE='';
/* ---------- bits ---------- */
const map=(h,cs,px,py)=>`<div class="mp" style="height:${h}px;--cs:${cs||110}px;--px:${px||'50%'};--py:${py||'50%'}"><i></i><u></u></div>`;
const ph=(t,h,w)=>`<div class="ph" style="height:${h}px;${w?'width:'+w+'px;':''}">${t}</div>`;
const tg=(t,c)=>`<span class="tg ${c==='n'?'nt':(c||'')}">${t}</span>`;
const sbar=()=>`<div class="sbar"><span>9:41</span><span>Data contoh</span></div>`;
const hd=(t,back)=>`<div class="phd">${back?'<span class="bk" data-back>&lsaquo;</span>':''}${t}</div>`;
const row=(i,t,s,go)=>`<div class="row" ${go?`data-go="${go}"`:''}><span class="ic">${i}</span><div><b>${t}</b>${s?`<small>${s}</small>`:''}</div><span class="ch">&rsaquo;</span></div>`;
const fld=(l,v,x)=>`<div class="fld"><div><small>${l}</small>${v}</div>${x||''}</div>`;
const sectionH=(t)=>`<div class="hd2">${t}</div>`;

/* ---------- shelf check sample (same shape as the real AI result) ---------- */
const SH={summary:'Rak mi terisi sekitar dua pertiga dengan dua celah terlihat. Merek kamu menguasai 38% facing tetapi sebagian besar ada di rak bawah.',full:68,share:38,facings:24,
 actions:[{n:1,a:'Isi ulang slot setinggi mata dari gudang belakang, minimal 6 facing',p:'Mi goreng Merek A isi 5',w:'Slot paling bernilai sedang kosong.',u:'Lakukan sekarang',o:'Kamu'},
  {n:2,a:'Pasang label harga untuk mi kuah ayam',p:'Mi kuah ayam Merek A',w:'Tanpa label, pembeli tidak bisa melihat harga.',u:'Kunjungan ini',o:'Kamu'},
  {n:3,a:'Minta manajer toko memindahkan lini mi kuah naik satu rak',p:null,w:'Rak bawah paling jarang terjual.',u:'Kunjungan berikutnya',o:'Perlu manajer'}],
 analysis:[['Slot terlaris kosong di rak setinggi mata','Label harga masih terpasang, jadi barang ini baru saja ada.','0 dari 24 facing'],['Promo pesaing menyedot perhatian','Merek B punya facing terbanyak dan label promo.','9 dari 24 facing (38%)'],['Produkmu tersebar di beberapa baris','Mi goreng di setinggi mata, mi kuah di rak bawah.','Merek A: 9 dari 24 facing (38%)']],
 products:[['KOSONG','b','Mi goreng Merek A isi 5','Merek A · 0 facing · 0% rak · rak setinggi mata · merek kamu','Rp 14.500','Label harga ada tetapi slot kosong.'],['RENDAH','w','Mi kuah ayam Merek A','Merek A · 2 facing · 8% rak · rak bawah · merek kamu','Label harga tidak terlihat','Baris tipis. Keyakinan sedang.'],['OK','','Mi kari Merek B','Merek B · 9 facing · 38% rak · rak setinggi mata','Rp 3.200 (promo)','Label promo terlihat.'],['OK','','Mi cup Merek C','Merek C · 6 facing · 25% rak · rak tengah','Rp 4.800','Stok cukup.']],
 gaps:[['Rak setinggi mata, sisi kiri','Slot kosong dengan label harga masih terpasang. Kemungkinan: Mi goreng Merek A isi 5']],
 comps:[['Merek B','9 facing · 38%','Menguasai rak setinggi mata dan menjalankan promo.'],['Merek C','6 facing · 25%','Rak tengah, stabil.']],
 issues:[['Merek kamu ada di rak bawah','Hanya lini mi kuah yang rendah, tetapi produk terlaris kosong di setinggi mata.'],['Label harga hilang','Mi kuah ayam Merek A belum punya.']],
 limits:['Stok gudang tidak terlihat, jadi slot kosong belum tentu berarti toko kehabisan.','Rak paling atas terpotong di foto.']};

/* ---------- estimasi sisa kredit API (contoh) ---------- */
const BUDGET=5,USED={shelf:140,ins:20};
const MODELS={haiku:{n:'Haiku 5.5',i:0.10,o:0.50},sonnet:{n:'Sonnet 5.5',i:2,o:10}};
const TOK={shelf:[2700,2500],ins:[3000,1500]};
let MD='haiku';
const cost=(m,k)=>(TOK[k][0]*MODELS[m].i+TOK[k][1]*MODELS[m].o)/1e6;
const usd=v=>'$'+v.toFixed(2),usd4=v=>'$'+v.toFixed(4);
function CRED(){const m=MODELS[MD],cs=cost(MD,'shelf'),ci=cost(MD,'ins');
 const used=USED.shelf*cs+USED.ins*ci,left=Math.max(0,BUDGET-used),pct=Math.min(100,used/BUDGET*100);
 return `<div class="card" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>Perkiraan sisa kredit AI</b>${tg('Perkiraan','n')}</div>
<div style="font-size:26px;font-weight:600;margin:6px 0 2px">${usd(left)} <span style="font-size:13px;font-weight:400;color:var(--mut)">dari ${usd(BUDGET)}</span></div>
<div style="height:8px;background:#e6e1d6;border-radius:4px;overflow:hidden"><div style="height:8px;width:${pct.toFixed(1)}%;background:${pct>80?'#a4372b':'var(--br)'}"></div></div>
<small>Terpakai sekitar ${usd(used)} (${USED.shelf} cek rak + ${USED.ins} wawasan, model ${m.n}). Sisa cukup untuk sekitar ${Math.floor(left/cs).toLocaleString('id-ID')} cek rak lagi.</small>
<div class="chips" style="margin:8px 0 4px"><span class="lbl">Model</span>${Object.keys(MODELS).map(k=>`<button data-md="${k}" aria-pressed="${k===MD}" style="min-height:34px;padding:0 10px">${MODELS[k].n}</button>`).join('')}</div>
<small>Hitungan kasar: jumlah pemakaian x biaya rata-rata per cek (${usd4(cs)} per cek rak, ${usd4(ci)} per wawasan). Saldo asli ada di console Anthropic, angka ini bisa meleset.</small></div>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-md]');if(!b)return;MD=b.dataset.md;if(view==='desk')renderDesk();else renderPhone()});
/* ---------- phone screens ---------- */
let ROLE='rep';
const P={
login:()=>sbar()+`<div class="pn" style="justify-content:center;padding:0 26px"><div style="font-size:30px;font-weight:600;color:var(--br)">Zonein</div><div style="color:var(--mut);margin-bottom:22px">Mulai aktivitasmu hari ini</div>${fld('Email','[employee@sample.com]')}${fld('Kata sandi','••••••••','<span>tampilkan</span>')}<div class="btn" data-go="home" style="margin-top:4px">Masuk</div><div style="color:var(--mut);font-size:11px;margin-top:12px">Akun dibuat oleh admin. Tidak ada pendaftaran mandiri.</div></div>`,
home:()=>sbar()+`<div class="pn"><div style="padding:6px 16px 4px;display:flex;gap:10px;align-items:center"><span class="row" style="padding:0;border:0;background:none"><span class="ic" style="width:36px;height:36px;border-radius:50%">E</span></span><div><small style="color:var(--mut)">Halo,</small><div style="font-weight:600">[Nama karyawan]</div></div><span style="margin-left:auto;color:var(--mut);font-size:12px" data-go="login">Keluar</span></div>
<div class="sec">PEKERJAANMU</div>
${row('A','Absensi','absen masuk dan pulang','attendance')}${row('S','Kunjungan Toko','termasuk Ketersediaan di Rak','visit')}${row('C','Cek Rak','foto lorong rak, dapat peringatan restok','shelf')}${row('$','Input Penjualan','','sales')}${row('P','Harga','','pricing')}${row('L','Cuti','','leave')}${row('R','Laporan Kehadiran','riwayat absensimu','presence')}${row('M','Ringkasan Aktivitas','','summary')}
${ROLE==='mgr'?`<div class="sec">ALAT MANAJER</div>${row('AI','Wawasan AI','ringkasan penjualan, stok, dan harga','insights')}${row('A','Laporan Absensi','','mattend')}${row('V','Laporan Kunjungan Toko','','mvisits')}${row('S','Kelola Toko','','mstores')}${row('A','Penugasan Toko','','massign')}${row('L','Persetujuan Cuti','3 menunggu','mleave')}<div class="sec">ADMIN</div>${row('+','Tambah Karyawan','','madd')}`:''}</div>`,
attendance:()=>sbar()+`<div class="pn">${hd('Absensi',1)}<div class="pb"><div class="card"><small>Status</small><b style="font-size:18px">Absen masuk pukul 08:02</b><small>Area toko, akurasi 12 m</small></div>${ph('Pratinjau selfie',150)}<div style="height:10px"></div>${fld('Lokasi','-6.2088, 106.8456 (akurasi 12 m)')}<div class="btn" data-go="attendance">Ambil selfie dan absen pulang</div><div style="font-size:11px;color:var(--mut);margin-top:10px">Absen masuk butuh selfie dan GPS. Jika lokasi mati, absen diblokir. Tidak dicek terhadap zona.</div><div class="btn o" style="margin-top:14px" data-go="presence">Lihat laporan kehadiran</div></div></div>`,
presence:()=>sbar()+`<div class="pn">${hd('Laporan Kehadiran',1)}<div class="pb"><div class="chips" style="margin:0 0 10px"><button style="min-height:36px;padding:0 10px">19 - 26 Okt</button></div>${['Sen, 26 Okt|08:02|17:14','Jum, 23 Okt|08:10|16:58','Kam, 22 Okt|07:58|17:05','Rab, 21 Okt|08:31|-'].map(r=>{const[a,b,c]=r.split('|');return `<div class="card" data-go="presdetail"><small>${a}</small><b>[Nama karyawan]</b><div class="kv" style="margin-top:8px"><div class="kpi">Absen masuk<b>${b}</b></div><div class="kpi">Absen pulang<b>${c}</b></div></div></div>`}).join('')}</div></div>`,
presdetail:()=>sbar()+`<div class="pn">${hd('Detail Kehadiran',1)}<div class="pb"><b>[Nama karyawan]</b><div class="kv" style="margin:10px 0"><div class="kpi">Absen masuk<b>08:02</b></div><div class="kpi">Absen pulang<b>17:14</b></div></div><div class="hd2" style="margin-top:6px">Foto</div><div class="kv">${ph('Selfie masuk',120)}${ph('Selfie pulang',120)}</div><div class="hd2">Lokasi</div>${map(170,70)}<small style="color:var(--mut)">Akurasi GPS 12 m</small></div></div>`,
visit:()=>sbar()+`<div class="pn">${hd('Kunjungan Toko',1)}<div class="pb">${fld('Toko','[Toko 3] ([ST-003])','<span>▾</span>')}${ph('Foto toko',170)}<div style="height:12px"></div><div class="btn" data-go="zone">Kirim kunjungan</div><div style="font-size:11px;color:var(--mut);margin-top:10px">Server memeriksa posisimu terhadap zona toko. Kamu tidak bisa mengatur hasilnya.</div></div></div>`,

let stack=['login'];
function renderPhone(){
  const cur=stack[stack.length-1];
  $('pscreen').innerHTML=P[cur]();$('pscreen').scrollTop=0;
  $('idx').innerHTML=`<h2>Layar</h2><div class="chips" style="margin-bottom:10px"><span class="lbl">Peran</span><button data-role="rep" aria-pressed="${ROLE==='rep'}">Sales lapangan</button><button data-role="mgr" aria-pressed="${ROLE==='mgr'}">Manajer</button></div>`+IDX.map(g=>`<div class="grp"><b>${g[0]}</b><div class="chips" style="margin:0">${g[1].map(s=>`<button data-j="${s[0]}" aria-pressed="${s[0]===cur}" style="min-height:40px">${s[1]}</button>`).join('')}</div></div>`).join('');
}
$('pscreen').addEventListener('click',e=>{if(e.target.closest('[data-back]')){if(stack.length>1)stack.pop();else stack=['home'];if(stack[stack.length-1]==='login'&&stack.length===1)stack=['home'];renderPhone();return}const g=e.target.closest('[data-go]');if(g){const to=g.dataset.go;if(to==='login'){stack=['login']}else if(to==='home'){stack=['home']}else stack.push(to);renderPhone()}});
$('idx').addEventListener('click',e=>{const r=e.target.closest('[data-role]');if(r){ROLE=r.dataset.role;renderPhone();return}const j=e.target.closest('[data-j]');if(j){stack=j.dataset.j==='login'?['login']:(j.dataset.j==='home'?['home']:['home',j.dataset.j]);renderPhone()}});

'Wawasan AI':()=>side('Wawasan AI')+`<div class="main"><h3>Wawasan AI</h3><div class="sub">30 hari terakhir, dibuat 26 Okt 09:10. Disusun dari input penjualan, cek rak, cek harga, dan kunjungan.</div>${CRED()}<div style="display:flex;gap:6px;margin-bottom:12px">${tg('7 hari','n')} ${tg('30 hari')} ${tg('90 hari','n')}</div><div style="font-size:19px;font-weight:600;margin-bottom:12px;max-width:760px">Mi memimpin penjualan, tetapi Merek A kehilangan ruang setinggi mata di 2 toko.</div><div class="three"><div><div class="hd" style="margin-top:0">Temuan</div><div class="dbox"><b>Mi goreng Merek A kosong di rak setinggi mata di 2 toko</b><small>2 dari 5 cek rak ditandai KOSONG. Lini mi kuah tanpa label harga.</small></div><div class="dbox"><b>Promo Merek B menarik volume</b><small>Merek B 1.240 unit (+18%), Merek A 980 (+1%).</small></div><div class="hd">Catatan harga</div><div class="dbox">Mi kari Merek B tampil promo Rp 3.200 di 3 toko, Rp 3.800 di 1 toko.</div></div><div><div class="hd" style="margin-top:0">Risiko stok habis</div><div class="dbox"><b>Mi goreng Merek A isi 5</b><small>Kosong di setinggi mata, penjualan terakhir kuat. [Toko 3], [Toko 5]</small></div><div class="hd">Tindakan</div><div class="dact"><span class="n">1</span><div><b>Isi ulang Merek A di setinggi mata di [Toko 3] dan [Toko 5]</b><br>${tg('Sales','n')}</div></div><div class="dact"><span class="n">2</span><div><b>Negosiasikan ruang setinggi mata untuk Merek A</b><br>${tg('Manajer','n')}</div></div></div><div><div class="hd" style="margin-top:0">Data yang kurang</div><div class="dbox"><small>Penjualan terisi di 3 dari 5 toko.</small><small>Tidak ada data penjualan 30 hari sebelumnya di [Toko 4].</small></div><div class="dbox"><small>Ringkasan AI dari angka yang diisi di aplikasi. Periksa angka penting sebelum bertindak.</small></div></div></div></div>`,
'Penjualan dan harga':()=>side('Penjualan dan harga')+`<div class="main"><h3>Penjualan dan harga</h3><div class="sub">Diisi oleh sales. 30 hari terakhir.</div><div class="two"><div><div class="hd" style="margin-top:0">Unit terjual per produk</div><table><tr><th>Produk</th><th>Unit</th><th>Perubahan</th></tr><tr><td>Mi kari Merek B</td><td>1,240</td><td>+18%</td></tr><tr><td>Mi goreng Merek A isi 5</td><td>980</td><td>+1%</td></tr><tr><td>Mi cup Merek C</td><td>610</td><td>-4%</td></tr></table></div><div><div class="hd" style="margin-top:0">Harga rak terlihat</div><table><tr><th>Produk</th><th>Rendah</th><th>Tinggi</th><th>Promo</th></tr><tr><td>Mi kari Merek B</td><td>Rp 3.200</td><td>Rp 3.800</td><td>3 toko</td></tr><tr><td>Mi goreng Merek A</td><td>Rp 14.500</td><td>Rp 14.500</td><td>0</td></tr><tr><td>Mi cup Merek C</td><td>Rp 4.800</td><td>Rp 4.800</td><td>0</td></tr></table></div></div></div>`,
'Persetujuan cuti':()=>side('Persetujuan cuti')+`<div class="main"><h3>Persetujuan cuti</h3><div class="sub">3 menunggu.</div><table><tr><th>Karyawan</th><th>Jenis</th><th>Tanggal</th><th>Alasan</th><th></th></tr>${[['[Karyawan B]','Sakit','28 - 29 Okt','Demam'],['[Karyawan D]','Cuti','2 - 6 Nov','Acara keluarga'],['[Karyawan E]','Izin','30 Okt','Ke bank']].map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td><td>${tg('Setujui')} ${tg('Tolak','b')}</td></tr>`).join('')}</table></div>`,
'Toko':()=>side('Toko')+`<div class="main"><h3>Toko</h3><div class="sub">Radius zona adalah geofence untuk cek kunjungan. Tugaskan sales ke toko.</div><div class="two" style="grid-template-columns:1.4fr 1fr"><div><table><tr><th>Toko</th><th>Alamat</th><th>Zona</th><th>Ditugaskan</th></tr>${[1,2,3,4].map(i=>`<tr><td>[Toko ${i}] (ST-00${i})</td><td>[Alamat ${i}]</td><td>100 m</td><td>[Karyawan ${'ABCD'[i-1]}]</td></tr>`).join('')}</table></div><div><div class="hd" style="margin-top:0">Tambah toko</div>${fld('Nama','')}${fld('Lintang / Bujur','')}${fld('Radius zona (m)','100')}<div class="btn">Tambah toko</div></div></div></div>`,
'Karyawan':()=>side('Karyawan')+`<div class="main"><h3>Karyawan</h3><div class="sub">Akun dibuat di sini oleh login pemilik. Tidak ada pendaftaran mandiri.</div><div class="two" style="grid-template-columns:1.4fr 1fr"><div><table><tr><th>Nama</th><th>Peran</th><th>Toko</th></tr>${[['[Karyawan A]','Sales lapangan','2'],['[Karyawan B]','Sales lapangan','1'],['[Karyawan C]','Sales lapangan','1'],['[Nama manajer]','Manajer','all']].map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td></tr>`).join('')}</table></div><div><div class="hd" style="margin-top:0">Tambah karyawan</div>${fld('Nama lengkap','')}${fld('Email','')}${fld('Kata sandi sementara','')}${fld('Peran','Sales lapangan','<span>▾</span>')}<div class="btn">Buat akun</div></div></div></div>`
};
function fitBoard(){const w=$('fit').clientWidth,s=w/1280;$('board').style.transform=`scale(${s})`;$('fit').style.height=(800*s)+'px'}
function renderDesk(){
  $('dpages').innerHTML='<span class="lbl">Halaman</span>'+PAGES.map((n,i)=>`<button data-d="${n}" aria-pressed="${n===dp}">${n}</button>`).join('');
  $('board').innerHTML=D[dp]();fitBoard();
}
$('dpages').addEventListener('click',e=>{const b=e.target.closest('[data-d]');if(!b)return;dp=b.dataset.d;renderDesk()});
$('board').addEventListener('click',e=>{const g=e.target.closest('[data-pg]');if(g&&D[g.dataset.pg]){dp=g.dataset.pg;renderDesk()}});
dp='Dasbor';
let view='phone';
$('views').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;view=b.dataset.v;[...$('views').children].forEach(x=>x.setAttribute('aria-pressed',x===b));$('phoneView').hidden=view!=='phone';$('deskView').hidden=view!=='desk';if(view==='desk')renderDesk()});
addEventListener('resize',()=>{if(view==='desk')fitBoard()});
renderPhone();
</script>

</body>
</html>
