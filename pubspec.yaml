name: zonein
description: >
  Zonein -- field-force attendance, geofenced store visits, and on-shelf
  availability reporting for PT. Logic Soft Computer.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.17.2
  geolocator: ^14.0.3
  image_picker: ^1.2.3
  permission_handler: ^13.0.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
